name: Publish Release

on:
  push:
    branches:
      - 3.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Read release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists
        run: |
          git fetch --tags --force
          git rev-parse "${{ steps.version.outputs.tag }}"

      - name: Install dependencies
        run: npm ci

      - name: Build extension bundle
        run: npm run extension

      - name: Build ZIP asset
        run: npm run zip

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASSET="build/tabular-extension-v${VERSION}.zip"
          NOTES="docs/releases/v${VERSION}.md"
          TITLE="Tabular ${TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "$TITLE" --notes-file "$NOTES"
          fi
