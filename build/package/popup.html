<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 200px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    .title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }
    .desc {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .usage {
      font-size: 11px;
      color: #888;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="title">框选复制</div>
  <div class="desc">在任意网页上拖拽鼠标创建选择框，智能提取并复制文本内容</div>
  <div class="usage">
    <strong>使用方法：</strong><br>
    1. 按住鼠标左键拖拽<br>
    2. 释放鼠标完成选择<br>
    3. 点击复制按钮
  </div>
  <script src="popup.js"></script>
</body>
</html>
