<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="128" height="128" rx="16" fill="url(#bg)"/>
  
  <!-- 选择框 -->
  <rect x="24" y="32" width="80" height="64" 
        fill="none" 
        stroke="rgba(255,255,255,0.8)" 
        stroke-width="3" 
        stroke-dasharray="8,4" 
        rx="4"/>
  
  <!-- 文本线条 -->
  <rect x="36" y="44" width="56" height="6" fill="rgba(255,255,255,0.9)" rx="2"/>
  <rect x="36" y="56" width="48" height="6" fill="rgba(255,255,255,0.9)" rx="2"/>
  <rect x="36" y="68" width="52" height="6" fill="rgba(255,255,255,0.9)" rx="2"/>
  <rect x="36" y="80" width="44" height="6" fill="rgba(255,255,255,0.9)" rx="2"/>
  
  <!-- 复制图标 -->
  <g transform="translate(88, 16)">
    <rect x="0" y="0" width="20" height="20" fill="rgba(255,255,255,0.9)" rx="3"/>
    <rect x="4" y="4" width="12" height="12" fill="rgba(102,126,234,0.8)" rx="2"/>
    <rect x="6" y="6" width="8" height="2" fill="white" rx="1"/>
    <rect x="6" y="10" width="6" height="2" fill="white" rx="1"/>
    <rect x="6" y="14" width="7" height="2" fill="white" rx="1"/>
  </g>
</svg>