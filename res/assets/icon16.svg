
    <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
      </defs>
      
      <!-- 背景 -->
      <rect width="16" height="16" rx="2" fill="url(#bg)"/>
      
      <!-- 选择框 -->
      <rect x="3.2" y="4" width="9.6" height="8" 
            fill="none" 
            stroke="rgba(255,255,255,0.8)" 
            stroke-width="1" 
            stroke-dasharray="1,0.5" 
            rx="0.5"/>
      
      <!-- 文本线条 -->
      <rect x="4.8" y="5.6" width="6.4" height="1" fill="rgba(255,255,255,0.9)" rx="0.25"/>
      <rect x="4.8" y="7.2" width="4.8" height="1" fill="rgba(255,255,255,0.9)" rx="0.25"/>
      <rect x="4.8" y="8.8" width="5.6" height="1" fill="rgba(255,255,255,0.9)" rx="0.25"/>
      
      <!-- 复制图标 -->
      <g transform="translate(11.2, 2.4)">
        <rect x="0" y="0" width="2.4" height="2.4" fill="rgba(255,255,255,0.9)" rx="0.25"/>
        <rect x="0.48" y="0.48" width="1.44" height="1.44" fill="rgba(102,126,234,0.8)" rx="0.125"/>
      </g>
    </svg>
  