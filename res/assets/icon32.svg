
    <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
      </defs>
      
      <!-- 背景 -->
      <rect width="32" height="32" rx="4" fill="url(#bg)"/>
      
      <!-- 选择框 -->
      <rect x="6.4" y="8" width="19.2" height="16" 
            fill="none" 
            stroke="rgba(255,255,255,0.8)" 
            stroke-width="1" 
            stroke-dasharray="2,1" 
            rx="1"/>
      
      <!-- 文本线条 -->
      <rect x="9.6" y="11.2" width="12.8" height="2" fill="rgba(255,255,255,0.9)" rx="0.5"/>
      <rect x="9.6" y="14.4" width="9.6" height="2" fill="rgba(255,255,255,0.9)" rx="0.5"/>
      <rect x="9.6" y="17.6" width="11.2" height="2" fill="rgba(255,255,255,0.9)" rx="0.5"/>
      
      <!-- 复制图标 -->
      <g transform="translate(22.4, 4.8)">
        <rect x="0" y="0" width="4.8" height="4.8" fill="rgba(255,255,255,0.9)" rx="0.5"/>
        <rect x="0.96" y="0.96" width="2.88" height="2.88" fill="rgba(102,126,234,0.8)" rx="0.25"/>
      </g>
    </svg>
  