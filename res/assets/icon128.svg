            rx="4"/>
      
      <!-- 文本线条 -->
      <rect x="38.4" y="44.8" width="51.2" height="8" fill="rgba(255,255,255,0.9)" rx="2"/>
      <rect x="38.4" y="57.6" width="38.4" height="8" fill="rgba(255,255,255,0.9)" rx="2"/>
      <rect x="38.4" y="70.4" width="44.8" height="8" fill="rgba(255,255,255,0.9)" rx="2"/>
      
      <!-- 复制图标 -->
      <g transform="translate(89.6, 19.2)">
        <rect x="0" y="0" width="19.2" height="19.2" fill="rgba(255,255,255,0.9)" rx="2"/>
        <rect x="3.84" y="3.84" width="11.52" height="11.52" fill="rgba(102,126,234,0.8)" rx="1"/>
