<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择框演示</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        
        /* 故意添加一些可能冲突的样式 */
        div {
            border: 1px solid red !important;
            background: yellow !important;
            z-index: 1000 !important;
        }
        
        .test-content {
            padding: 20px;
            margin: 20px 0;
            background: #f0f0f0;
        }
    </style>
    <link rel="stylesheet" href="content-script.css">
</head>
<body>
    <h1>选择框 UI 演示</h1>
    
    <div class="test-content">
        <h2>测试内容区域</h2>
        <p>这是一些测试文本，用于验证选择框是否能正确显示在页面上。</p>
        <p>即使页面有冲突的 CSS 样式，选择框也应该能正确显示。</p>
    </div>
    
    <button id="testBtn">点击测试选择框</button>
    
    <script type="module">
        import { SelectionBox } from './src/components/SelectionBox.js';
        
        const selectionBox = new SelectionBox();
        
        document.getElementById('testBtn').addEventListener('click', () => {
            // 创建选择框
            selectionBox.startSelection(100, 100);
            
            // 模拟拖拽
            setTimeout(() => {
                selectionBox.updateSelection(300, 200);
            }, 500);
            
            // 清除选择框
            setTimeout(() => {
                selectionBox.clearSelection();
            }, 2000);
        });
    </script>
</body>
</html>
